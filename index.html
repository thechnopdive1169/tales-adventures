<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#1d3b38; }
  body { text-align:left; }
  #game { display:block; width:100vw; height:100vh; image-rendering:auto; touch-action:none; }
  #hud {
    position:fixed; top:10px; left:10px; z-index:5;
    background:rgba(16,50,47,.55); color:#eafff4; padding:8px 12px; border-radius:10px;
    font:700 13px/1.4 system-ui, sans-serif; letter-spacing:.4px; user-select:none;
    display:flex; gap:16px; align-items:center; pointer-events:none;
    backdrop-filter:blur(2px);
  }
  #hud .chip { display:inline-flex; align-items:center; gap:6px; }
  #hud .lvl { color:#ffe9a8; }
  #hud .coin { color:#ffd75e; }
  #hintBox {
    position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:5;
    background:rgba(16,50,47,.5); color:#dffcf2; padding:6px 12px; border-radius:8px;
    font:600 12px system-ui, sans-serif; user-select:none; pointer-events:none;
    opacity:0; transition:opacity .4s;
  }
  #hintBox.show { opacity:1; }
  @media (max-aspect-ratio: 5/4) {
    #hintBox { bottom: 138px; }
  }
  #overlay {
    position:fixed; inset:0; z-index:8; background:rgba(10,34,32,.72); display:none;
    align-items:center; justify-content:center; color:#eafff4;
    font:700 15px/1.6 system-ui, sans-serif; text-align:center;
  }
  #overlay.show { display:flex; }
  #overlay .card { background:#21524c; border:2px solid #6fb8a6; border-radius:14px; padding:22px 30px; max-width:86vw; }
  #overlay h2 { margin:0 0 6px; font-size:22px; color:#ffe9a8; }
  #overlay .sub { color:#bde8da; font-size:13px; font-weight:500; margin-bottom:14px; }
  #overlay button, #hud .hbtn {
    font:700 13px system-ui, sans-serif; color:#123733; background:#ffd75e; border:none;
    border-radius:8px; padding:9px 18px; cursor:pointer;
  }
  #overlay button:hover { background:#ffe694; }
  #restartBtn { position:fixed; top:10px; right:10px; z-index:6; opacity:.75; }
  #restartBtn:hover { opacity:1; }
  #shopBtn {
    position:fixed; top:10px; right:56px; z-index:6; opacity:.9;
    font:700 13px system-ui, sans-serif; color:#123733; background:#ffd75e;
    border:none; border-radius:8px; padding:9px 14px; cursor:pointer;
  }
  #shopBtn:hover { opacity:1; }
  #shop {
    position:fixed; inset:0; z-index:9; background:rgba(10,34,32,.72); display:none;
    align-items:center; justify-content:center; color:#eafff4;
    font:700 15px/1.6 system-ui, sans-serif; text-align:center;
  }
  #shop.show { display:flex; }
  #shop .card { background:#21524c; border:2px solid #6fb8a6; border-radius:14px; padding:22px 30px; max-width:86vw; min-width:min(420px, 86vw); }
  #shop h2 { margin:0 0 2px; font-size:22px; color:#ffe9a8; }
  #shop .sub { color:#bde8da; font-size:13px; font-weight:500; margin-bottom:6px; }
  #shop .sec { margin:14px 0 8px; font-size:13px; color:#ffe9a8; letter-spacing:1px; text-transform:uppercase; }
  #shop .srow { display:flex; gap:14px; align-items:center; justify-content:space-between; background:rgba(0,0,0,.18); border-radius:10px; padding:10px 14px; }
  #shop .sinfo { text-align:left; font-size:13px; font-weight:500; color:#bde8da; }
  #shop .sinfo b { display:block; font-size:15px; color:#eafff4; }
  #shop button { font:700 13px system-ui, sans-serif; color:#123733; background:#ffd75e; border:none; border-radius:8px; padding:9px 18px; cursor:pointer; white-space:nowrap; }
  #shop button:hover:enabled { background:#ffe694; }
  #shop button:disabled { opacity:.55; cursor:default; }
  #shop .skins { display:flex; gap:10px; justify-content:center; margin:6px 0 16px; }
  #shop .skin { width:52px; height:52px; border-radius:12px; background:rgba(0,0,0,.25); border:2px dashed rgba(255,255,255,.35); display:flex; align-items:center; justify-content:center; font-size:20px; color:rgba(255,255,255,.5); }
  #fade {
    position:fixed; inset:0; z-index:7; pointer-events:none;
    background:#eafff4; opacity:0; transition:opacity .32s ease;
  }
  #fade.on { opacity:1; }
  #touchCtl { position:fixed; inset:0; z-index:4; display:none; pointer-events:none; }
  #touchCtl.show { display:block; }
  .tbtn {
    position:fixed; pointer-events:auto; user-select:none; -webkit-user-select:none;
    background:rgba(255,255,255,.16); border:2px solid rgba(255,255,255,.35); color:#fff;
    border-radius:16px; display:flex; align-items:center; justify-content:center;
    font:800 22px system-ui, sans-serif; touch-action:none; -webkit-tap-highlight-color:transparent;
  }
  .tbtn:active, .tbtn.on { background:rgba(255,255,255,.35); }
  .tbtn .k { font-size:10px; font-weight:600; opacity:.7; display:block; margin-left:4px; }
  #btnL { left:16px; bottom:18px; width:86px; height:64px; }
  #btnR { left:112px; bottom:18px; width:86px; height:64px; }
  #btnJ { right:108px; bottom:18px; width:92px; height:92px; border-radius:50%; font-size:20px; }
  #btnD { right:18px; bottom:96px; width:76px; height:58px; }
  @media (pointer:fine) { #restartBtn { position:fixed; } }
</style>

<canvas id="game"></canvas>

<div id="hud">
  <span class="chip lvl" id="lvlEl">Lv 1</span>
  <span class="chip coin"><span id="coinIcon">●</span><span id="coinEl">0</span></span>
  <span class="chip" id="dashEl" style="color:#aef2d8;">dash: on</span>
</div>
<button id="restartBtn" class="hbtn" title="Restart level (R)">↺</button>
<button id="shopBtn" title="Open shop">🛒 Shop</button>
<div id="hintBox"></div>
<div id="fade"></div>

<div id="overlay">
  <div class="card">
    <h2 id="ovTitle">Level cleared!</h2>
    <div class="sub" id="ovSub"></div>
    <button id="ovBtn">Continue</button>
  </div>
</div>

<div id="shop">
  <div class="card">
    <h2>Shop</h2>
    <div class="sub">Wallet: <span id="shopCoinsEl">0</span> <span style="color:#ffd75e;">●</span></div>
    <div class="sec">Upgrades</div>
    <div class="srow">
      <div class="sinfo"><b>Air Dash</b><span>Dash once in mid-air. Refills when you land or cling.</span></div>
      <button id="buyAirDashBtn">30 ●</button>
    </div>
    <div class="sec">Skins</div>
    <div class="sub">Not implemented yet — coming soon!</div>
    <div class="skins">
      <div class="skin">?</div>
      <div class="skin">?</div>
      <div class="skin">?</div>
      <div class="skin">?</div>
    </div>
    <button id="shopCloseBtn">Close</button>
  </div>
</div>

<div id="touchCtl">
  <div class="tbtn" id="btnL">◀</div>
  <div class="tbtn" id="btnR">▶</div>
  <div class="tbtn" id="btnJ">⤒<span class="k">JUMP</span></div>
  <div class="tbtn" id="btnD">»<span class="k">DASH</span></div>
</div>

<script src="src/game.js"></script>
